services:
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  worker:
    build: .
    command: npx tsx src/work-queue/worker.ts
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
    depends_on:
      rabbitmq:
        condition: service_healthy
    # To run 2 workers: docker compose up --scale worker=2

  inventory-consumer:
    build: .
    command: npx tsx src/pubsub/inventory-consumer.ts
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
    depends_on:
      rabbitmq:
        condition: service_healthy

  notification-consumer:
    build: .
    command: npx tsx src/pubsub/notification-consumer.ts
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
    depends_on:
      rabbitmq:
        condition: service_healthy

  rpc-server:
    build: .
    command: npx tsx src/rpc/server.ts
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
    depends_on:
      rabbitmq:
        condition: service_healthy

  dashboard:
    build: .
    command: npx tsx src/dashboard/server.ts
    ports:
      # Bound to localhost only: the dashboard has no authentication
      - "127.0.0.1:3000:3000"
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      RABBITMQ_MGMT_URL: http://rabbitmq:15672
      RABBITMQ_MGMT_USER: guest
      RABBITMQ_MGMT_PASS: guest
      HOST: 0.0.0.0
      PORT: "3000"
    depends_on:
      rabbitmq:
        condition: service_healthy
